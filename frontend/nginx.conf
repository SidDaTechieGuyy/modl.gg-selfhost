body {
  margin: 0;
  font-family: Inter, "Segoe UI", sans-serif;
  background: #0f172a;
  color: #e2e8f0;
}

* { box-sizing: border-box; }

button, input {
  font: inherit;
}

.shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 2rem;
}

.card {
  width: min(100%, 480px);
  background: rgba(15, 23, 42, 0.9);
  border: 1px solid rgba(148, 163, 184, 0.2);
  border-radius: 20px;
  padding: 2rem;
  box-shadow: 0 30px 80px rgba(15, 23, 42, 0.4);
}

.auth-card form {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  margin-top: 1.25rem;
}

input {
  border-radius: 12px;
  border: 1px solid rgba(148, 163, 184, 0.25);
  background: rgba(15, 23, 42, 0.6);
  color: white;
  padding: 0.85rem 1rem;
}

button {
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #38bdf8, #8b5cf6);
  color: white;
  padding: 0.9rem 1rem;
  font-weight: 700;
  cursor: pointer;
}

button.secondary {
  background: transparent;
  border: 1px solid rgba(148, 163, 184, 0.25);
}

.eyebrow {
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-size: 0.7rem;
  color: #7dd3fc;
}

h1, h3 {
  margin: 0.25rem 0 0;
}

.toggle-row {
  display: flex;
  gap: 0.5rem;
  margin-top: 1rem;
}

.toggle {
  flex: 1;
  background: rgba(148, 163, 184, 0.1);
  border: 1px solid rgba(148, 163, 184, 0.15);
}

.toggle.active {
  background: rgba(59, 130, 246, 0.2);
}

.error-box {
  margin-top: 1rem;
  background: #7f1d1d;
  color: #fecaca;
  border: 1px solid rgba(248, 113, 113, 0.6);
  padding: 0.75rem 1rem;
  border-radius: 12px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
}

.panel-card {
  width: min(100%, 720px);
}

.panel-grid {
  margin-top: 1.5rem;
  display: grid;
  gap: 1rem;
}

.panel-section {
  background: rgba(15, 23, 42, 0.55);
  border: 1px solid rgba(148, 163, 184, 0.15);
  border-radius: 16px;
  padding: 1rem;
}

.upload-box {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 90px;
  padding: 1rem;
  border: 1px dashed rgba(125, 211, 252, 0.5);
  border-radius: 12px;
  cursor: pointer;
  text-align: center;
}

.upload-box input {
  display: none;
}

.upload-list {
  list-style: none;
  padding: 0;
  margin: 0.75rem 0 0;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.upload-list a {
  color: #7dd3fc;
}
