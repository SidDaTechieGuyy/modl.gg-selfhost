version: "3.9"

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: modl_selfhost
    volumes:
      - modl_mongo_data:/data/db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      PORT: ${PORT:-8080}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/modl_selfhost}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
    ports:
      - "8080:8080"
    volumes:
      - modl_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "80:80"

volumes:
  modl_mongo_data:
  modl_uploads:
