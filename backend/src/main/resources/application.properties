spring.application.name=modl-backend
server.port=8080
server.shutdown=graceful
server.forward-headers-strategy=framework
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/modl}
spring.jackson.default-property-inclusion=non_null
spring.web.error.whitelabel.enabled=false
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB
spring.threads.virtual.enabled=true
spring.data.mongodb.auto-index-creation=false
modl.storage.directory=/app/uploads
modl.realtime.ws.enabled=true
modl.llm.gemini-model-id=gemini-3.1-flash-lite
modl.llm.gemini-api-key=${GEMINI_API_KEY:}
modl.llm.gemini-temperature=0.0
modl.llm.gemini-max-output-tokens=1024
modl.llm.gemini-top-p=0.1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.tomcat.connection-timeout=10s
